problem:
  orders_file: data/temp_days_2510/2510_2023-01-13.csv
  trucks_file: data/TruckMaster.csv
  distance_matrix_file: data/distmatrix_2510/distance_matrix_meters2510.csv
  depot_id: '2510'
  planning_horizon_hours: 24.0
column_generation:
  max_cg_iterations: 100
  reduced_cost_tolerance: -1.0e-06
  initial_routes: greedy
branch_and_bound:
  max_nodes: 500
  optimality_gap: 0.01
  node_selection: best_first
  branching_fractional_tolerance: 0.01
pomo:
  embedding_dim: 128
  num_encoder_layers: 6
  num_heads: 8
  feedforward_dim: 512
  node_feature_dim: 7
  num_pomo_starts: 10
  decode_method: sampling
  temperature: 1.0
  num_samples_per_start: 1
curriculum:
  stage_1:
    customers: 50
    epochs: 1000
  stage_2:
    customers: 100
    epochs: 1000
  stage_3:
    customers: 200
    epochs: 2000
training:
  num_epochs: 1000
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  num_train_instances: 10000
  num_val_instances: 1000
  max_customers_per_instance: 50
  checkpoint_interval: 15
  pretrained_model: D:\Uni Material\Code_Odyssey\Code\DQN\260407\results\exp_matrix_20260410\pomo_model_epoch_120_state_dict.pt
training_data:
  augment_8fold: true
  temp_day_dirs:
  - data/temp_days_2510
  - data/temp_days_2522
  - data/temp_days_2524
  distance_matrix_dirs:
  - data/distmatrix_2510
  - data/distmatrix_2522
  - data/distmatrix_2524
  distance_matrix_pattern: distance_matrix_meters{depot_id}.csv
  stage_tiny_max_customers: 8
  stage_medium_max_customers: 40
  stage_sampling_weights:
    tiny_warmup:
      tiny: 1.0
      small_medium: 0.0
      large: 0.0
    main:
      tiny: 0.1
      small_medium: 0.45
      large: 0.45
  curriculum_stages:
  - name: tiny_warmup
    epochs: 2
    max_customers: 8
  - name: main
    epochs: 998
    max_customers: 80
dp_solver:
  beam_width: 25
  max_total_labels: 100000
ga_generator:
  population_size: 50
  num_generations: 100
  mutation_rate: 0.3
  max_route_length: 20
pricing:
  max_pomo_strikes: 3
  dp_fallback_threshold: 0.3
column_selector:
  method: rlcg
  checkpoint: D:\Uni Material\Code_Odyssey\Code\DQN\260407\results\train_20260410_175131_col_selector_rlcg\pretrained_col_selector\dqn_model_rlcg_epoch_3000.pt
  hidden_dim: 64
  max_family_size: 5
  stop_q_threshold: 0.0
solver:
  seed: 42
  device: cpu
logging:
  results_dir: results
  log_level: INFO
