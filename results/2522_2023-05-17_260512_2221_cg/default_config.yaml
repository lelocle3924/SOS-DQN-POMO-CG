problem:
  orders_file: "data/temp_days_2522/2522_2023-05-17.csv"  # Single-problem orders CSV path.
  trucks_file: "data/TruckMaster.csv"  # Truck master CSV path (capacity/cost/speed/count).
  distance_matrix_file: "data/distmatrix_2522/distance_matrix_meters2522.csv"  # Single-problem distance matrix CSV path.
  depot_id: "2522"  # Depot identifier used for node/matrix alignment.
  planning_horizon_hours: 24.0  # Time horizon used for feasibility and feature scaling (hours).

column_generation:
  max_cg_iterations: 5000  # Maximum column-generation iterations.
  reduced_cost_tolerance: -1.0e-6  # Reduced-cost threshold to accept improving columns.
  initial_routes: "greedy"  # Initial route construction strategy.

branch_and_bound:
  max_nodes: 500  # Maximum B&B nodes to explore.
  optimality_gap: 0.001  # Early-stop relative optimality gap.
  node_selection: "best_first"  # B&B node selection strategy.
  branching_fractional_tolerance: 0.001  # Fractionality tolerance for branching decisions.

pomo:
  embedding_dim: 128  # Transformer embedding dimension.
  num_encoder_layers: 6  # Number of encoder layers.
  num_heads: 8  # Multi-head attention head count.
  feedforward_dim: 512  # Feed-forward hidden dimension in encoder blocks.
  node_feature_dim: 7  # Node feature size expected by model input.
  num_pomo_starts: 50  # Parallel POMO starts per instance (capped by customer count).
  decode_method: "sampling"  # Default decoding policy ("sampling" or "greedy").
  temperature: 1.0  # Softmax temperature for sampling decode.
  num_samples_per_start: 1  # Number of samples generated per POMO start.

training:
  num_epochs: 1000  # Total training epochs.
  batch_size: 64  # Training batch size (instances per step).
  learning_rate: 1.0e-5  # Adam learning rate.
  weight_decay: 1.0e-5  # Adam weight decay (L2 regularization).
  num_train_instances: 32000  # Target sampled instances per epoch.
  num_val_instances: 1000  # Target sampled instances per validation pass.
  max_customers_per_instance: 50  # Max sampled customers in each training subgraph.
  checkpoint_interval: 15  # Save checkpoint every N epochs.
  pretrained_model: "results/train_20260421_204908_pomo_training/pretrained_pomo/model_epoch_200.pt"  # Pretrained POMO checkpoint path for downstream components.

training_data:
  augment_8fold: true  # Apply 8-fold coordinate augmentation.
  real_data_mix_ratio: 0.75  # Real-data sampling weight in mixed training.
  synthetic_data_mix_ratio: 0.25  # Synthetic-data sampling weight in mixed training.
  temp_day_dirs:  # Directories containing per-day real orders CSVs.
    - "data/temp_days_2510"
    - "data/temp_days_2522"
    - "data/temp_days_2524"
  distance_matrix_dirs:  # Directories containing matching distance matrices.
    - "data/distmatrix_2510"
    - "data/distmatrix_2522"
    - "data/distmatrix_2524"
  distance_matrix_pattern: "distance_matrix_meters{depot_id}.csv"  # Matrix filename pattern where {depot_id} is substituted.
  stage_tiny_max_customers: 16  # Upper customer limit for "tiny" bucket.
  stage_medium_max_customers: 40  # Upper customer limit for "small_medium" bucket.
  stage_sampling_weights:  # Sampling weights by stage and problem-size bucket.
    tiny_warmup:
      tiny: 1.0  # Tiny bucket weight during warmup stage.
      small_medium: 0.0  # Small/medium bucket weight during warmup stage.
      large: 0.0  # Large bucket weight during warmup stage.
    main:
      tiny: 0.1  # Tiny bucket weight during main stage.
      small_medium: 0.45  # Small/medium bucket weight during main stage.
      large: 0.45  # Large bucket weight during main stage.
  curriculum_stages:  # Active POMO curriculum schedule.
    - name: "tiny_warmup"  # Stage name used by sampler.
      epochs: 8  # Number of epochs to run this stage.
      max_customers: 16  # Stage-specific max customers per instance.
    - name: "main"  # Main training stage.
      epochs: 992  # Number of epochs to run this stage.
      max_customers: 100  # Stage-specific max customers per instance.

dp_solver:
  beam_width: 25  # Beam width for DP-based pricing.
  max_total_labels: 100000  # Maximum total DP labels to control complexity.

ga_generator:
  population_size: 50  # Genetic algorithm population size.
  num_generations: 100  # Genetic algorithm generation count.
  mutation_rate: 0.3  # Mutation probability in GA.
  max_route_length: 20  # Maximum route length generated by GA.

pricing:
  max_pomo_strikes: 3  # Max consecutive failed POMO pricing attempts before fallback.
  dp_fallback_threshold: 0.3  # Trigger threshold for DP fallback during pricing.

column_selector:
  method: "none"  # Column selector mode: one of "none", "rlcg", "ffcg".
  checkpoint: ""  # Selector checkpoint path.
  hidden_dim: 64  # Hidden dimension for selector network.
  max_family_size: 5  # Max selected columns per family/group.
  stop_q_threshold: 0.0  # Q-value threshold for learned stop action.

rlcg_training:
  alpha: 1.0  # Reward scaling for objective improvement term.
  gamma: 0.99  # Discount factor for RL training.
  epsilon_start: 1.0  # Initial epsilon for epsilon-greedy exploration.
  epsilon_end: 0.05  # Final epsilon after decay.
  epsilon_decay_steps: 1000  # Steps over which epsilon decays.
  replay_capacity: 5000  # Replay buffer capacity.
  min_replay_size: 128  # Minimum replay size before updates begin.
  batch_size: 32  # RL minibatch size for selector training.
  train_steps_per_collect: 10  # Gradient steps per collection cycle.
  target_update_interval: 50  # Target-network update interval.
  max_episode_steps: 8  # Max steps per RL episode.
  gradient_clip_norm: 1.0  # Gradient clipping norm for RL updates.

solver:
  seed: 42  # Global random seed for reproducibility.
  device: "cuda"  # Preferred compute device ("cuda" or "cpu").

logging:
  results_dir: "results"  # Root directory for outputs/checkpoints/logs.
  log_level: "INFO"  # Logging verbosity level.

exact:
  time_limit_seconds: 1800  # Time limit for exact solver runs (seconds).
  assume_unlimited_vehicles: false  # Ignore vehicle-count limits when true.
  max_vehicles_per_type: 50  # Per-type vehicle cap for exact model.
